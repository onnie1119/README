<script>
$(document).ready(function () {
			$('a').click(function () { setLocalStorage(this); });
		});

		function setLocalStorage(link) {
			let url = $(link).attr("href");
			let lastIndex = url.lastIndexOf("/");
			let keyWord = url.substr(lastIndex + 1);
			localStorage.setItem("frameSrc", keyWord);
		}
