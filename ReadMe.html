<script>


			
	$(document).ready(function () {
		localStorage.clear();
		$('.menu').addClass('clicked');
		$('a').not(".openNew").click(function (e) { e.preventDefault(); loadPage(this); });
		$('#mySidebar a,.dropdown-btn').click(function() {keepClicked(this)});
		$('#frame').on('load', function() {
			let url = localStorage.getItem("frameSrc")
			if (url != null)
			{
				console.log(url);
				let item = $(`#mySidebar a[href*='${url}']`).first();
				console.log(item);
				if ($(item).length > 0)
				{
					let btn = $(item).closest(".dropdown-btn");
					if ($(btn).length > 0)
					{
						keepClicked(btn);
					}
					else
					{
						let container = $(item).closest(".dropdown-container");
						console.log(container);
						if ($(container).length > 0)
						{
							$(container).prev().addClass('active');
							$(container).find('span').addClass('turnDir');
							$(container).css('display', 'block');
							console.log($(container).prev());
						}
						keepClicked(item);
					}					
				}
			}
		});
	});

	function loadPage(link) {
		$("#frame").attr("src", link);
	}

	function keepClicked(item) {
		localStorage.removeItem("frameSrc");
		$('#mySidebar').find('.clicked').removeClass('clicked');
		$(item).addClass('clicked');
	}

	var dropdown = document.getElementsByClassName("dropdown-btn");
	var i;

	for (i = 0; i < dropdown.length; i++) {
		dropdown[i].addEventListener("click", function () {
			this.classList.toggle("active");
			
			if ($(this).hasClass('active'))
			{
				$(this).find('span').addClass('turnDir');
			}
			else
			{
				$(this).find('span').removeClass('turnDir');
			}
			
			var dropdownContent = this.nextElementSibling;
			if (dropdownContent.style.display === "block") {
				dropdownContent.style.display = "none";
			} else {
				dropdownContent.style.display = "block";
			}
		});
	}
	function openNav() {
		document.getElementById("mySidebar").style.width = "305px";
		document.getElementById("main").style.marginLeft = "305px";
		if ($(window).width() > 1400) {
			document.getElementsByClassName("middle")[0].style.marginLeft = "305px";
		}
		else {
			document.getElementsByClassName("middle")[0].style.marginLeft = "0";
		}
	}

	function closeNav() {
		document.getElementById("mySidebar").style.width = "0";
		document.getElementById("main").style.marginLeft = "0";
		document.getElementsByClassName("middle")[0].style.marginLeft = "0";
	}
	
	

</script>
